name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: pss_local
          POSTGRES_PASSWORD: pss_local_only
          POSTGRES_DB: pss_operational
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pss_local -d pss_operational"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install pinned pnpm
        run: npm install -g pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workspace
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture boundary check
        run: pnpm architecture:check
      - name: Contract check
        run: PSS_CONTRACT_BASE_REF=origin/main pnpm contracts:check
      - name: Database migration check
        run: pnpm db:check
      - name: UI token and copy check
        run: pnpm ui:check
      - name: Shared component stories
        run: pnpm --filter @pss/web build-storybook
      - name: Install browser for UI accessibility checks
        run: pnpm --filter @pss/web exec playwright install --with-deps chromium
      - name: Check template accessibility
        run: pnpm test:a11y
      - name: Feature directory source check
        run: pnpm features:check
      - name: Secret pattern check
        run: pnpm secrets:check
      - name: Unit tests
        run: pnpm test
      - name: Integration scaffold check
        env:
          PSS_TEST_DATABASE_URL: postgresql://pss_local:pss_local_only@127.0.0.1:5432/pss_operational
        run: pnpm test:integration
      - name: E2E scaffold check
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
